[project]
name = "cybersec-saude-backend"
version = "0.1.0"
description = "API do CyberSec Saúde (FastAPI)"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.20.1",
    "bcrypt>=5.0.0",
    "cryptography>=50.0.2",
    "fastapi>=0.162.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.2",
    "pydantic[email]>=2.14.1",
    "pyotp>=2.10.0",
    "segno>=1.6.6",
    "sqlalchemy>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "N", "SIM", "RUF", "ANN"]
ignore = ["N818"]  # nomes em português (ex.: ErroCriptografia)

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "ANN"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=app --cov-report=term-missing"

[tool.coverage.run]
branch = true

[tool.bandit]
exclude_dirs = ["tests"]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pip-audit>=2.10.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]
