name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, tipos, segurança, testes + Postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: cs_admin
          # Banco efêmero do CI, destruído ao fim do job; não é segredo de nenhum ambiente.
          POSTGRES_PASSWORD: ci-efemero
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cs_admin" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      POSTGRES_USER: cs_admin
      POSTGRES_PASSWORD: ci-efemero
      POSTGRES_DB: postgres
      DB_HOST: localhost
      DB_PORT: "5432"
      REQUIRE_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Gera senhas aleatórias das roles para esta execução
        run: |
          echo "::add-mask::$(openssl rand -hex 24 | tee /tmp/app_pw)"
          echo "::add-mask::$(openssl rand -hex 24 | tee /tmp/mig_pw)"
          echo "APP_DB_PASSWORD=$(cat /tmp/app_pw)" >> "$GITHUB_ENV"
          echo "MIGRATOR_DB_PASSWORD=$(cat /tmp/mig_pw)" >> "$GITHUB_ENV"
          rm /tmp/app_pw /tmp/mig_pw
      - name: Gera chaves de criptografia aleatórias para esta execução
        run: |
          kek=$(openssl rand -base64 32); hmac=$(openssl rand -base64 32)
          echo "::add-mask::$kek"; echo "::add-mask::$hmac"
          { echo "KEK_KEYRING=1:$kek"; echo "KEK_ATIVA=1"; echo "HMAC_KEY=$hmac"; } >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check . ../db
      - run: uv run ruff format --check . ../db
      - run: uv run mypy .
      - run: uv run bandit -r app scripts
      - run: uv run pytest
      - name: Cobertura mínima nos módulos críticos (cripto)
        run: uv run coverage report --include="app/core/crypto.py" --fail-under=95
      - name: Cobertura mínima nos módulos críticos (auth)
        run: >-
          uv run coverage report --fail-under=90
          --include="app/core/senha.py,app/core/cpf.py,app/core/totp.py,app/services/auth.py,app/services/usuario.py,app/services/mfa.py,app/services/sessao.py,app/api/auth.py,app/api/mfa.py,app/api/deps.py"
      - name: Cobertura mínima nos módulos críticos (auditoria)
        run: >-
          uv run coverage report --fail-under=95
          --include="app/core/cadeia.py,app/services/cadeia_log.py,app/services/auditoria.py,app/repositories/log.py"
      - name: Cobertura mínima nos módulos críticos (RBAC e pacientes)
        run: >-
          uv run coverage report --fail-under=90
          --include="app/services/autorizacao.py,app/services/paciente.py,app/repositories/rbac.py,app/repositories/paciente.py,app/api/pacientes.py,app/schemas/paciente.py,app/api/deps.py"
      - run: uv run pip-audit

  frontend:
    name: Frontend (lint, testes, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm test
      - run: npm audit --audit-level=high

  secrets:
    name: Varredura de segredos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Build das imagens
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t cybersec-saude-backend:ci backend
      - run: docker build -t cybersec-saude-frontend:ci frontend
