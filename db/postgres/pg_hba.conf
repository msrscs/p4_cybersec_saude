# Autenticação do Postgres local/CI (ADR-0013, ADR-0029): pela rede, só TLS + SCRAM; sem TLS, recusa.
# O socket local existe só dentro do container (inicialização e healthcheck).
# TYPE     DATABASE  USER  ADDRESS     METHOD
local      all       all               trust
hostssl    all       all   0.0.0.0/0   scram-sha-256
hostssl    all       all   ::/0        scram-sha-256
hostnossl  all       all   0.0.0.0/0   reject
hostnossl  all       all   ::/0        reject
