# Ambiente LOCAL de desenvolvimento. Segredos vêm do .env (fora do git); veja .env.example.
#
# Os três módulos são independentes e são as mesmas imagens publicadas na AWS (ADR-0029):
#   frontend/  -> task Fargate atrás do ALB (CloudFront na frente, TLS na borda)
#   backend/   -> task Fargate alcançada só pelo frontend; rotinas por EventBridge Scheduler
#   db/        -> imagem de migrations/bootstrap, executada como task avulsa
# Aqui o Postgres local substitui o Aurora Serverless v2 e não há borda: o frontend responde em
# http://localhost:3000 (o Chromium trata localhost como contexto seguro para os cookies Secure).
x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: ["/tmp"]

# Conexão das imagens Python com o Postgres local: TLS obrigatório com o certificado efêmero do
# container (require). Na AWS: DB_SSLMODE=verify-full e DB_SSLROOTCERT=/etc/ssl/rds/global-bundle.pem.
x-banco-local: &banco-local
  DB_HOST: db
  DB_PORT: "5432"
  DB_SSLMODE: require
  DB_SSLROOTCERT: ""

services:
  db:
    image: postgres:18
    container_name: cybersec_saude-db
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:5433:5432"   # só acessível da sua máquina; 5433 evita o conflito
    networks: [dados, db_host]  # só a API, as rotinas e as migrations alcançam o banco (ADR-0028)
    entrypoint: ["/postgres/iniciar.sh"]   # TLS obrigatório, certificado gerado no container
    volumes:
      - cybersec_saude_pgdata:/var/lib/postgresql
      - ./db/postgres:/postgres:ro
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Módulo de banco: não sobe com `docker compose up`. Uso:
  #   docker compose run --rm migrar                                  # alembic upgrade head
  #   docker compose run --rm migrar python -m scripts.bootstrap_db   # roles (1x)
  #   docker compose run --rm migrar python -m scripts.importar_cid   # catálogo CID
  migrar:
    <<: *hardening
    build:
      context: .
      dockerfile: db/Dockerfile
    profiles: ["migracao"]
    env_file: .env
    environment:
      <<: *banco-local
    networks: [dados]
    depends_on:
      db:
        condition: service_healthy

  backend:
    <<: *hardening
    build: ./backend
    container_name: cybersec_saude-backend
    restart: unless-stopped
    environment:
      <<: *banco-local
      ENVIRONMENT: ${ENVIRONMENT:-dev}
      # A API conecta como app_user (menor privilégio), nunca como superusuário.
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB no .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?defina APP_DB_PASSWORD no .env}
      # Chaves de criptografia (ADR-0004): só no ambiente, nunca no banco.
      KEK_KEYRING: ${KEK_KEYRING:?defina KEK_KEYRING no .env (scripts.gerar_chaves)}
      KEK_ATIVA: ${KEK_ATIVA:?defina KEK_ATIVA no .env}
      HMAC_KEY: ${HMAC_KEY:?defina HMAC_KEY no .env}
      # IP real do usuário para a auditoria: só a rede do frontend pode informar X-Forwarded-For.
      # Na AWS: o CIDR das subnets privadas das tasks do frontend.
      FORWARDED_ALLOW_IPS: 172.30.10.0/24
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [api, dados]      # sem porta publicada: só o frontend fala com a API
    depends_on:
      db:
        condition: service_healthy

  # Rotinas periódicas (ADR-0013). Na AWS, o EventBridge Scheduler roda a mesma imagem com
  # `python -m scripts.tarefas limpar` (15 min) e `... verificar-log` (1 h) como tasks avulsas.
  tarefas:
    <<: *hardening
    build: ./backend
    container_name: cybersec_saude-tarefas
    restart: unless-stopped
    environment:
      <<: *banco-local
      ENVIRONMENT: ${ENVIRONMENT:-dev}
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB no .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?defina APP_DB_PASSWORD no .env}
      KEK_KEYRING: ${KEK_KEYRING:?defina KEK_KEYRING no .env (scripts.gerar_chaves)}
      KEK_ATIVA: ${KEK_ATIVA:?defina KEK_ATIVA no .env}
      HMAC_KEY: ${HMAC_KEY:?defina HMAC_KEY no .env}
      # Só as rotinas recebem a chave dos checkpoints; a API não precisa dela (ADR-0010).
      LOG_CHECKPOINT_KEY: ${LOG_CHECKPOINT_KEY:?defina LOG_CHECKPOINT_KEY no .env}
    command: ["python", "-m", "scripts.tarefas", "agendar"]
    healthcheck:
      disable: true               # não serve HTTP
    networks: [dados]
    depends_on:
      db:
        condition: service_healthy

  frontend:
    <<: *hardening
    build: ./frontend
    container_name: cybersec_saude-frontend
    restart: unless-stopped
    environment:
      API_URL: http://backend:8000
      # Dev local sem borda: o navegador fala direto com o frontend. Na AWS: TLS_NA_BORDA=true,
      # ORIGEM_PUBLICA=https://<domínio>, PROXIES_CONFIAVEIS=<CIDR da VPC> e
      # IP_CLIENTE_HEADER=cloudfront-viewer-address (ADR-0029).
      # Sem ORIGEM_PUBLICA em dev: o Origin é comparado com o Host da requisição, então tanto
      # http://localhost:3000 quanto http://127.0.0.1:3000 funcionam.
      NODE_ENV: development
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      api: {}
      web: {}                     # só para publicar a porta no localhost
    depends_on:
      backend:
        condition: service_healthy

networks:
  api:
    internal: true                # frontend -> API, sem saída para a internet
    ipam:
      config:
        - subnet: 172.30.10.0/24
  dados:
    internal: true                # API, rotinas e migrations -> banco; o frontend não entra aqui
    ipam:
      config:
        - subnet: 172.30.30.0/24
  web: {}
  db_host: {}                     # apenas para publicar a porta do banco no localhost (dev)

volumes:
  cybersec_saude_pgdata:
